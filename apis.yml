name: Superconductive
description: >-
  Superconductive Inc. is the company behind Great Expectations (GX), an
  open-source data quality framework used to validate, document, and profile
  data across modern data stacks. Teams declare "Expectations" — assertions
  about how data should behave — and GX Core, the Apache-2.0 Python library that
  is the engine of the platform, tests batches of data against them, generates
  human-readable Data Docs, and integrates with orchestration and cloud data
  tools. Superconductive is backed by Index Ventures. GX is distributed
  primarily as a Python package rather than a hosted REST API; the managed GX
  Cloud SaaS offering has been wound down, leaving the open-source library as the
  supported surface.
